<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
    --bg: #0a1929;
    --bg-light: #0f2744;
    --card: rgba(15, 39, 68, 0.4);
    --border: rgba(186, 230, 253, 0.15);
    --text: #f8fafc;
    --text-dim: #94a3b8;
    --accent: #7dd3fc;
    --success: #6ee7b7;
    --success-bg: rgba(110, 231, 183, 0.1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Shippori Mincho', 'Noto Serif JP', serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
}

.container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 20px;
}

header {
    text-align: center;
    margin-bottom: 40px;
    padding-bottom: 30px;
    border-bottom: 1px solid var(--border);
}

h1 {
    font-size: 2rem;
    font-weight: 600;
    margin-bottom: 8px;
    letter-spacing: 1px;
}

.subtitle {
    color: var(--text-dim);
    font-size: 0.95rem;
    font-style: italic;
}

/* Stats */
.stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 15px;
    margin-bottom: 30px;
}

.stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px;
    text-align: center;
}

.stat-number {
    font-size: 1.8rem;
    font-weight: 700;
    color: var(--accent);
    display: block;
}

.stat-label {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 4px;
}

/* Progress */
.progress-section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 30px;
}

.progress-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.progress-label {
    font-size: 0.85rem;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
}

.progress-percent {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent);
    font-family: 'Noto Serif JP', serif;
}

.progress-bar-bg {
    width: 100%;
    height: 8px;
    background: rgba(186, 230, 253, 0.1);
    border-radius: 4px;
    overflow: hidden;
}

.progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--success));
    border-radius: 4px;
    transition: width 0.5s ease;
    width: 0%;
}

/* Controls */
.controls {
    margin-bottom: 30px;
}

.search-input {
    width: 100%;
    padding: 12px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    margin-bottom: 15px;
}

.search-input:focus {
    outline: none;
    border-color: var(--accent);
}

.search-input::placeholder { color: var(--text-dim); }

.cat-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
}

.cat-btn {
    padding: 6px 14px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 20px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    transition: all 0.2s;
}

.cat-btn:hover {
    border-color: var(--accent);
    color: var(--text);
}

.cat-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--bg);
    font-weight: 600;
}

/* Export buttons */
.export-buttons {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

.export-btn {
    padding: 10px 18px;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.85rem;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
}

.export-btn:hover {
    border-color: var(--accent);
    background: rgba(125, 211, 252, 0.1);
}

/* Content */
.category-section {
    margin-bottom: 40px;
}

.category-title {
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 15px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
    color: var(--accent);
}

.words-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 10px;
}

.word-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    transition: all 0.2s;
    position: relative;
}

.word-card:hover {
    border-color: var(--accent);
}

.word-card.studied {
    border-color: var(--success);
    background: var(--success-bg);
}

.word-card.studied::after {
    content: '✓';
    position: absolute;
    top: 8px;
    right: 10px;
    color: var(--success);
    font-size: 1rem;
    font-weight: 700;
}

.word-kanji {
    font-size: 1.3rem;
    font-weight: 600;
    margin-bottom: 2px;
}

.word-hiragana {
    font-size: 0.85rem;
    color: var(--accent);
    margin-bottom: 6px;
    font-style: italic;
}

.word-meaning {
    font-size: 0.85rem;
    color: var(--text-dim);
    margin-bottom: 10px;
}

.word-actions {
    display: flex;
    gap: 6px;
}

.btn-mark {
    flex: 1;
    padding: 6px 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.75rem;
    transition: all 0.2s;
}

.btn-mark:hover {
    border-color: var(--success);
    color: var(--success);
}

.btn-mark.marked {
    background: var(--success);
    border-color: var(--success);
    color: var(--bg);
    font-weight: 600;
}

.btn-copy {
    padding: 6px 10px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
}

.btn-copy:hover {
    border-color: var(--accent);
    color: var(--accent);
}

/* Toast */
.toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--accent);
    color: var(--bg);
    padding: 10px 20px;
    border-radius: 20px;
    font-weight: 600;
    font-size: 0.9rem;
    opacity: 0;
    transition: all 0.3s;
    z-index: 1000;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

@media (max-width: 600px) {
    h1 { font-size: 1.5rem; }
    .words-grid { grid-template-columns: 1fr; }
    .stat-number { font-size: 1.4rem; }
}
</style>
</head>

<div class="container">
    <header>
        <h1>雪女 · Vocabulário Japonês</h1>
        <p class="subtitle">Domine as palavras na neve eterna</p>
    </header>

    <div class="stats">
        <div class="stat">
            <span class="stat-number" id="totalWords">0</span>
            <span class="stat-label">Total</span>
        </div>
        <div class="stat">
            <span class="stat-number" id="studiedWords">0</span>
            <span class="stat-label">Estudadas</span>
        </div>
        <div class="stat">

            <span class="stat-label">Restantes</span>
        </div>
        <div class="stat">
            <span class="stat-number" id="categoriesCount">0</span>
            <span class="stat-label">Categorias</span>
        </div>
    </div>

    <div class="progress-section">
        <div class="progress-header">
            <span class="progress-label">Progresso de domínio</span>
            <span class="progress-percent" id="progressPercent">0.00%</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>
    </div>

    <div class="controls">
        <input type="text" class="search-input" id="searchInput" placeholder="Buscar palavra (kanji, hiragana ou português)...">
        
        <div class="cat-buttons" id="categoryButtons"></div>
        
        <div class="export-buttons">
            <button class="export-btn" onclick="exportFull()">📊 Exportar tudo (XLSX)</button>
            <button class="export-btn" onclick="exportStudied()">✓ Exportar estudadas (XLSX)</button>
        </div>
    </div>

    <div id="content"></div>
</div>

<div class="toast" id="toast">Copiado!</div>

let currentCategory = 'all';
let searchQuery = '';
let studiedWords = new Set();

function loadProgress() {
    try {
        const saved = localStorage.getItem('studiedWords');
        if (saved) studiedWords = new Set(JSON.parse(saved));
    } catch (e) { console.warn(e); }
}

function saveProgress() {
    try {
        localStorage.setItem('studiedWords', JSON.stringify([...studiedWords]));
    } catch (e) { console.warn(e); }
}

function renderCategoryButtons() {
    const container = document.getElementById('categoryButtons');
    let html = '<button class="cat-btn active" onclick="selectCategory(\'all\', this)">Todas</button>';
    Object.entries(vocabulary).forEach(([key, cat]) => {
        html += `<button class="cat-btn" onclick="selectCategory('${key}', this)">${cat.name}</button>`;
    });
    container.innerHTML = html;
}

function selectCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderContent();
}

function toggleStudied(word) {
    if (studiedWords.has(word)) studiedWords.delete(word);
    else studiedWords.add(word);
    saveProgress();
    renderContent();
    updateStats();
}

function copyWord(word) {
    navigator.clipboard.writeText(word).then(() => {
        const toast = document.getElementById('toast');
        toast.textContent = `「${word}」 copiado!`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    });
}

function updateStats() {
    let total = 0;
    Object.values(vocabulary).forEach(cat => total += cat.words.length);
    
    const studied = studiedWords.size;
    const remaining = total - studied;
    const percentage = total > 0 ? (studied / total) * 100 : 0;
    
    document.getElementById('totalWords').textContent = total;
    document.getElementById('studiedWords').textContent = studied;
    document.getElementById('remainingWords').textContent = remaining;
    document.getElementById('categoriesCount').textContent = Object.keys(vocabulary).length;
    
    const percentText = percentage.toFixed(2) + '%';
    document.getElementById('progressPercent').textContent = percentText;
    document.getElementById('progressBar').style.width = percentText;
}

function renderContent() {
    const container = document.getElementById('content');
    let html = '';
    
    if (currentCategory === 'all') {
        Object.entries(vocabulary).forEach(([key, cat]) => {
            html += renderCategory(key, cat);
        });
    } else {
        const cat = vocabulary[currentCategory];
        html = renderCategory(currentCategory, cat);
    }
    
    container.innerHTML = html;
}

function renderCategory(key, cat) {
    const filteredWords = cat.words.filter(w => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return w[0].includes(q) || w[1].toLowerCase().includes(q) || w[2].includes(q);
    });
    
    if (filteredWords.length === 0) return '';
    
    let html = `
        <div class="category-section">
            <h2 class="category-title">${cat.name}</h2>
            <div class="words-grid">
    `;
    
    filteredWords.forEach(w => {
        const isStudied = studiedWords.has(w[0]);
        html += `
            <div class="word-card ${isStudied ? 'studied' : ''}">
                <div class="word-kanji">${w[0]}</div>
                <div class="word-hiragana">${w[2]}</div>
                <div class="word-meaning">${w[1]}</div>
                <div class="word-actions">
                    <button class="btn-mark ${isStudied ? 'marked' : ''}" onclick="toggleStudied('${w[0]}')">
                        ${isStudied ? '✓ Estudada' : 'Marcar'}
                    </button>
                    <button class="btn-copy" onclick="copyWord('${w[0]}')">📋</button>
                </div>
            </div>
        `;
    });
    
    html += '</div></div>';
    return html;
}

// Exportação XLSX
function exportFull() {
    const wb = XLSX.utils.book_new();
    const wsData = [['Categoria', 'Kanji', 'Hiragana', 'Significado', 'Estudada']];
    
    Object.entries(vocabulary).forEach(([key, cat]) => {
        cat.words.forEach(w => {
            wsData.push([cat.name, w[0], w[2], w[1], studiedWords.has(w[0]) ? 'Sim' : 'Não']);
        });
    });
    
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    
    // Ajustar largura das colunas
    ws['!cols'] = [
        { wch: 25 },
        { wch: 12 },
        { wch: 18 },
        { wch: 35 },
        { wch: 10 }
    ];
    
    XLSX.utils.book_append_sheet(wb, ws, 'Vocabulário Completo');
    XLSX.writeFile(wb, 'vocabulario_completo.xlsx');
    
    showToast('Tabela completa exportada!');
}

function exportStudied() {
    const wb = XLSX.utils.book_new();
    const wsData = [['Categoria', 'Kanji', 'Hiragana', 'Significado']];
    
    Object.entries(vocabulary).forEach(([key, cat]) => {
        cat.words.forEach(w => {
            if (studiedWords.has(w[0])) {
                wsData.push([cat.name, w[0], w[2], w[1]]);
            }
        });
    });
    
    const ws = XLSX.utils.aoa_to_sheet(wsData);
    
    ws['!cols'] = [
        { wch: 25 },
        { wch: 12 },
        { wch: 18 },
        { wch: 35 }
    ];
    
    XLSX.utils.book_append_sheet(wb, ws, 'Palavras Estudadas');
    XLSX.writeFile(wb, 'palavras_estudadas.xlsx');
    
    showToast(`${studiedWords.size} palavras exportadas!`);
}

function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2500);
}

document.getElementById('searchInput').addEventListener('input', (e) => {
    searchQuery = e.target.value;
    renderContent();
});

document.addEventListener('DOMContentLoaded', () => {
    loadProgress();
    renderCategoryButtons();
    renderContent();
    updateStats();
});
</script>
